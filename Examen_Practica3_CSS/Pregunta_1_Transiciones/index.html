<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pregunta 1 - Transiciones Avanzadas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#" class="logo">Portafolio<span>.dev</span></a>
            <ul class="nav-links">
                <li><a href="#" class="active">Inicio</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-card">
            <h2>Envíanos un Mensaje</h2>
            <p>Interactúa con los campos para ver las transiciones suaves.</p>
            <form class="form-group">
                <div class="input-box">
                    <input type="text" required>
                    <label>Tu Nombre</label>
                </div>
                <div class="input-box">
                    <input type="email" required>
                    <label>Tu Correo Electrónico</label>
                </div>
                <button type="submit" class="btn-transition">Enviar Mensaje</button>
            </form>
        </section>
    </main>
</body>
</html>
